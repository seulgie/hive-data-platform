name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # login shell so the conda env is active in every step
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda env from environment.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install the package
        run: pip install -e .

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest -q