# Local DuckDB warehouse. No secrets, so this file is committed.
hive_platform:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Run by hand, dbt writes the live warehouse directly. Airflow sets DBT_DUCKDB_PATH to a
      # separate build file and publishes it only after the tests pass (hive_platform.ops.publish).
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/lake/warehouse.duckdb') }}"
      threads: 4
      settings:
        TimeZone: UTC          # timestamps are UTC everywhere; local dates are derived explicitly
